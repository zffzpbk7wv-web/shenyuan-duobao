<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="深淵奪寶">
  <meta name="theme-color" content="#0b0810">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>深淵奪寶</title>
  <style>
    :root {
      --bg0: #07050b;
      --bg1: #110c18;
      --bg2: #1a1424;
      --panel: #1c1528cc;
      --line: #4a3a63;
      --line-soft: #2c233c;
      --gold: #f0c75e;
      --gold-dim: #b8892d;
      --text: #efe6d6;
      --muted: #9a8e7a;
      --hp: #d44545;
      --hp-hi: #ff6d6d;
      --exp: #3d9a68;
      --exp-hi: #6ee09a;
      --atk: #e07a4a;
      --def: #5b8fd4;
      --danger: #ff5a5a;
      --ok: #6ee09a;
      --r-common: #c8c4bc;
      --r-rare: #4ea3ff;
      --r-epic: #c46bff;
      --r-legend: #ffb14a;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: var(--bg0);
      color: var(--text);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", "Source Han Sans TC", system-ui, sans-serif;
      user-select: none;
      overflow: hidden;
    }
    body {
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, #3a1d4a55, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 100%, #1a102e88, transparent 55%),
        linear-gradient(180deg, #0c0812 0%, #07050b 100%);
    }
    #app {
      max-width: 460px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-t);
      position: relative;
      background:
        linear-gradient(180deg, #16101fcc 0%, #0e0a14ee 100%);
      box-shadow: 0 0 80px #000a, inset 0 0 0 1px #2a2038;
    }
    header { padding: 10px 14px 8px; flex-shrink: 0; }
    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 18px;
      letter-spacing: 0.18em;
      font-weight: 700;
      color: var(--gold);
      text-shadow: 0 0 18px #f0c75e55, 0 2px 0 #000;
    }
    .icon-btns { display: flex; gap: 6px; }
    .icon-btn {
      background: #211a2e;
      border: 1px solid var(--line);
      color: var(--text);
      width: 36px; height: 36px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      display: grid; place-items: center;
    }
    .icon-btn:active { transform: scale(0.94); background: #2a2238; }
    .meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .pill {
      background: #2a1f38;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 10px;
      color: var(--gold);
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .pill.wave { color: #d7c6ff; font-weight: 500; }
    .coins {
      margin-left: auto;
      color: var(--gold);
      font-weight: 700;
      font-size: 15px;
      display: flex; align-items: center; gap: 4px;
      text-shadow: 0 0 10px #f0c75e44;
    }
    .hero-card {
      background: linear-gradient(180deg, #241b32 0%, #1a1426 100%);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 10px 10px;
      box-shadow: inset 0 1px 0 #ffffff12, 0 4px 16px #0006;
    }
    .hero-top {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 6px; font-size: 13px;
    }
    .hero-top .name { font-weight: 700; letter-spacing: 0.08em; }
    #lv { color: var(--gold); margin-left: 6px; }
    .stat-pills { display: flex; flex-wrap: wrap; gap: 6px 8px; color: var(--muted); font-size: 11px; justify-content: flex-end; }
    .stat-pills b { color: var(--text); font-weight: 700; }
    .stat-pills .atk b { color: var(--atk); }
    .stat-pills .def b { color: #8eb7ff; }
    .stat-pills .crit b { color: #ffd24a; }
    .stat-pills .cdmg b { color: #ff9a6b; }
    .stat-pills .hit b { color: #8fd9a8; }
    .stat-pills .dodge b { color: #7ecbff; }
    .stat-panel {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px 8px;
      margin-top: 8px;
      padding: 7px 8px;
      background: #160f20;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      font-size: 11px;
      color: var(--muted);
    }
    .stat-panel b { color: var(--text); font-weight: 700; }
    .bar {
      position: relative;
      height: 16px;
      background: #0c0a10;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #000;
      margin-top: 5px;
      box-shadow: inset 0 1px 3px #0008;
    }
    .bar .fill {
      height: 100%;
      width: 0%;
      border-radius: 8px;
      transition: width 0.25s ease;
      position: relative;
    }
    .bar .fill::after {
      content: "";
      position: absolute; inset: 0 auto 50% 0; right: 0;
      background: linear-gradient(180deg, #fff6, transparent);
    }
    .bar.hp .fill { background: linear-gradient(180deg, var(--hp-hi), var(--hp)); }
    .bar.exp .fill { background: linear-gradient(180deg, var(--exp-hi), var(--exp)); }
    .bar.mhp { height: 14px; margin-top: 6px; }
    .bar.mhp .fill { background: linear-gradient(180deg, #ff8a4a, #c13a2a); }
    .bar.boss .fill { background: linear-gradient(180deg, #ff6b9d, #9b1c4a); }
    .bar-text {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 2px #000d;
      pointer-events: none;
    }
    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0 12px;
    }
    .panel { display: none; flex: 1; min-height: 0; flex-direction: column; }
    .panel.active { display: flex; }
    #arena {
      position: relative;
      flex: 1;
      min-height: 180px;
      margin-top: 8px;
      border-radius: 14px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 70% 50% at 50% 80%, #3a204055, transparent 70%),
        linear-gradient(180deg, #1a1224 0%, #0c0814 100%);
      border: 1px solid var(--line);
      box-shadow: inset 0 0 40px #0008;
      cursor: pointer;
    }
    #fx {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 3;
    }
    #monster-wrap {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 2;
      padding: 12px 16px 20px;
    }
    #monster-emoji {
      font-size: 86px;
      line-height: 1;
      filter: drop-shadow(0 10px 8px #000a);
      animation: idle 2.4s ease-in-out infinite;
      transform-origin: 50% 80%;
      text-shadow: 0 0 24px #000;
    }
    #monster-wrap.boss #monster-emoji {
      font-size: 100px;
      animation: idle 1.6s ease-in-out infinite, bossglow 1.8s ease-in-out infinite;
    }
    #monster-wrap.hit #monster-emoji { animation: none; }
    #monster-wrap.hit { animation: shake 0.28s ease; }
    #monster-wrap.die #monster-emoji { animation: die 0.45s ease forwards; }
    @keyframes idle {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    @keyframes bossglow {
      0%, 100% { filter: drop-shadow(0 10px 8px #000a) drop-shadow(0 0 12px #ff4d6d88); }
      50% { filter: drop-shadow(0 10px 8px #000a) drop-shadow(0 0 26px #ffb14a99); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(4px); }
    }
    @keyframes die {
      to { transform: translateY(20px) scale(0.4) rotate(20deg); opacity: 0; }
    }
    #monster-name {
      margin-top: 6px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.1em;
      text-shadow: 0 2px 8px #000;
    }
    #monster-wrap.boss #monster-name { color: #ffb0c0; }
    .platform {
      position: absolute;
      left: 18%; right: 18%; bottom: 14%;
      height: 18px;
      background: radial-gradient(ellipse at center, #3a2a48, #1a1220 70%);
      border-radius: 50%;
      filter: blur(1px);
      opacity: 0.85;
      z-index: 1;
    }
    #banner {
      position: absolute;
      top: 10px; left: 50%;
      transform: translateX(-50%) translateY(-8px);
      background: linear-gradient(180deg, #5a1a2a, #3a1018);
      border: 1px solid #ff8aa0;
      color: #ffe0e6;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.3s, transform 0.3s;
      white-space: nowrap;
      box-shadow: 0 4px 20px #ff2a4a44;
    }
    #banner.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #log {
      height: 52px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.45;
      overflow: hidden;
      padding: 4px 6px;
      background: #0c0912aa;
      border-radius: 8px;
      border: 1px solid var(--line-soft);
    }
    #log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #log .good { color: var(--gold); }
    #log .rare { color: var(--r-rare); }
    #log .epic { color: var(--r-epic); }
    #log .legend { color: var(--r-legend); }
    #log .bad { color: #ff8a8a; }
    #log .ok { color: var(--ok); }
    .atk-row {
      display: flex; gap: 8px;
      padding: 8px 0 6px;
      flex-shrink: 0;
    }
    #btn-attack {
      flex: 1;
      height: 52px;
      border: 1px solid #e8b45a;
      border-radius: 12px;
      background: linear-gradient(180deg, #d4a23a 0%, #8a5a12 100%);
      color: #1a1004;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.28em;
      cursor: pointer;
      box-shadow: 0 4px 0 #4a2e08, 0 6px 16px #0008, inset 0 1px 0 #ffe29a;
      font-family: inherit;
    }
    #btn-attack:active, #btn-attack.cd {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #4a2e08, 0 3px 8px #0006, inset 0 1px 0 #ffe29a;
    }
    #btn-attack:disabled {
      filter: grayscale(0.4) brightness(0.7);
      cursor: default;
    }
    #auto-status {
      min-width: 72px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #1a1426;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 11px;
      color: var(--muted);
      padding: 4px 8px;
    }
    #auto-status.on { color: var(--ok); border-color: #2e6a48; }
    #auto-status b { font-size: 14px; display: block; }
    .scroll-panel {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 2px 12px;
    }
    .scroll-panel h2 {
      font-size: 13px;
      letter-spacing: 0.14em;
      color: var(--gold);
      margin: 2px 0 6px;
      font-weight: 700;
    }
    .hint { font-size: 11px; color: var(--muted); margin-bottom: 8px; line-height: 1.45; }
    .item {
      display: flex; align-items: center; gap: 10px;
      background: #1a1426;
      border: 1px solid var(--line-soft);
      border-left-width: 4px;
      border-radius: 10px;
      padding: 9px 10px;
      margin-bottom: 8px;
    }
    .item.r-common { border-left-color: var(--r-common); }
    .item.r-rare { border-left-color: var(--r-rare); }
    .item.r-epic { border-left-color: var(--r-epic); box-shadow: 0 0 12px #c46bff22; }
    .item.r-legend { border-left-color: var(--r-legend); box-shadow: 0 0 16px #ffb14a33; }
    .item .ico { font-size: 26px; width: 32px; text-align: center; }
    .item .meta { flex: 1; min-width: 0; }
    .item .iname { font-size: 13px; font-weight: 700; }
    .item .istats { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .item .actions { display: flex; flex-direction: column; gap: 4px; }
    .mini, .shop-btn, .enh-btn {
      border: 1px solid var(--line);
      background: #2a2238;
      color: var(--text);
      border-radius: 7px;
      padding: 5px 9px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .mini.ok, .shop-btn.ok, .enh-btn.ok { background: #2a4a34; border-color: #4a8a5a; color: #c8ffd4; }
    .mini.warn, .shop-btn.warn { background: #4a2a20; border-color: #8a5a40; color: #ffd0b0; }
    .mini:disabled, .shop-btn:disabled, .enh-btn:disabled { opacity: 0.4; cursor: default; }
    .mini:active, .shop-btn:active, .enh-btn:active { transform: scale(0.97); }
    .equipped-tag { font-size: 10px; color: var(--gold); margin-left: 4px; }
    .empty { text-align: center; color: var(--muted); padding: 28px 10px; font-size: 13px; }
    .enh-card, .shop-card {
      background: linear-gradient(180deg, #241b32, #1a1426);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .enh-card .row, .shop-card .row {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .enh-plus {
      font-size: 28px; font-weight: 800; color: var(--gold);
      text-shadow: 0 0 16px #f0c75e44;
    }
    .rate { font-size: 12px; color: var(--muted); margin: 8px 0; }
    .rate b { color: var(--text); }
    .rate.risky b { color: #ffb14a; }
    .rate.danger b { color: var(--danger); }
    .enh-btn {
      width: 100%;
      height: 42px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.1em;
      background: linear-gradient(180deg, #3a2a58, #2a1a40);
      border-color: #7a5aa0;
    }
    .flash-ok { animation: flashok 0.6s ease; }
    .flash-fail { animation: flashfail 0.6s ease; }
    @keyframes flashok { 0%, 100% { box-shadow: none; } 30% { box-shadow: 0 0 22px #6ee09a88; } }
    @keyframes flashfail { 0%, 100% { box-shadow: none; } 30% { box-shadow: 0 0 22px #ff5a5a88; } }
    .shop-card .price { color: var(--gold); font-weight: 700; }
    .shop-card p { font-size: 12px; color: var(--muted); margin: 6px 0 10px; line-height: 1.45; }
    nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      flex-shrink: 0;
      background: #120c1a;
      border-top: 1px solid var(--line);
      padding-bottom: var(--safe-b);
    }
    nav button {
      background: transparent;
      border: 0;
      color: var(--muted);
      padding: 10px 0 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.08em;
      position: relative;
    }
    nav button .ico { display: block; font-size: 18px; margin-bottom: 2px; }
    nav button.active { color: var(--gold); }
    nav button.active::before {
      content: "";
      position: absolute; top: 0; left: 20%; right: 20%;
      height: 2px; background: var(--gold);
      box-shadow: 0 0 8px var(--gold);
    }
    #modal, #intro {
      position: absolute; inset: 0;
      background: #06040acc;
      display: none;
      align-items: center; justify-content: center;
      z-index: 20;
      padding: 20px;
    }
    #modal.show, #intro.show { display: flex; }
    .modal-card {
      background: linear-gradient(180deg, #2a1e38, #160f20);
      border: 1px solid var(--gold-dim);
      border-radius: 16px;
      padding: 22px 18px 16px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 12px 40px #000c, 0 0 0 1px #000, 0 0 40px #f0c75e22;
      animation: popin 0.28s ease;
    }
    @keyframes popin {
      from { transform: scale(0.86); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-card h3 { color: var(--gold); letter-spacing: 0.16em; margin-bottom: 10px; font-size: 18px; }
    .modal-card p { font-size: 14px; color: var(--text); line-height: 1.7; margin-bottom: 8px; }
    .modal-card .sub { color: var(--muted); font-size: 12px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
    .modal-actions button, #intro-ok {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--gold-dim);
      background: linear-gradient(180deg, #d4a23a, #8a5a12);
      color: #1a1004;
      font-weight: 800;
      letter-spacing: 0.12em;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
    }
    .modal-actions button.ghost {
      background: #221a30;
      color: var(--text);
      border-color: var(--line);
      font-weight: 600;
    }
    .name-input {
      width: 100%;
      box-sizing: border-box;
      margin: 8px 0 4px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0c0912;
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      text-align: center;
      letter-spacing: 0.06em;
    }
    .name-input:focus { outline: none; border-color: var(--gold-dim); }
    .name-err { color: var(--danger); font-size: 12px; min-height: 18px; }
    .player-chip {
      margin-top: 2px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .player-chip b { color: var(--gold); }
    .player-chip button {
      margin-left: 6px;
      border: 0;
      background: none;
      color: var(--gold);
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }
    .modal-card.lb-card {
      max-width: 420px;
      text-align: left;
      max-height: min(86vh, 640px);
      overflow: auto;
    }
    .lb-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      margin-top: 8px;
    }
    .lb-table th {
      color: var(--muted);
      font-weight: 700;
      text-align: left;
      padding: 4px 3px;
      border-bottom: 1px solid var(--line);
      letter-spacing: 0.06em;
    }
    .lb-table td {
      padding: 6px 3px;
      border-bottom: 1px solid var(--line-soft);
      color: var(--text);
      vertical-align: top;
    }
    .lb-table tr.me td { color: var(--gold); background: #f0c75e14; }
    .lb-table .num { text-align: right; white-space: nowrap; }
    .lb-empty, .lb-err { font-size: 13px; color: var(--muted); margin: 12px 0; text-align: center; }
    .lb-err { color: #ffb14a; }
    #toast {
      position: absolute;
      top: 30%; left: 50%;
      transform: translate(-50%, -10px);
      background: #1a1228ee;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      z-index: 25;
      transition: opacity 0.25s, transform 0.25s;
      white-space: nowrap;
      box-shadow: 0 8px 24px #000a;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #player-fx {
      position: absolute;
      left: 14px; right: 14px; top: 0;
      height: 0;
      pointer-events: none;
      z-index: 6;
    }
    .dmg-float {
      position: absolute;
      font-weight: 800;
      font-size: 22px;
      pointer-events: none;
      text-shadow: 0 2px 0 #000, 0 0 8px #000;
      animation: floatup 0.85s ease-out forwards;
      z-index: 4;
    }
    .dmg-float.crit { font-size: 32px; color: #ffd24a !important; letter-spacing: 0.04em; text-shadow: 0 2px 0 #000, 0 0 14px #ffb14acc; }
    .dmg-float.heal { color: #6ee09a !important; }
    .dmg-float.miss { font-size: 20px; color: #9aa4b8 !important; letter-spacing: 0.12em; }
    .dmg-float.evade { font-size: 22px; color: #6ee0c4 !important; }
    @keyframes floatup {
      0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      70% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -56px) scale(1.15); }
    }
    .loot-line { margin: 4px 0; font-size: 14px; }
    .offline-stats {

    function isValidName(raw) {

      return s.length >= 1 && Array.from(s).length <= 12;
    }
    function newPlayerId() {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, '');
      var s = '', i, hex = '0123456789abcdef';
      for (i = 0; i < 32; i++) s += hex.charAt(Math.floor(Math.random() * 16));
      return s;
    }
    function ensurePlayerId() {
      var id = S.playerId;
      if (!id || typeof id !== 'string') {
        try { id = localStorage.getItem(PID_KEY) || ''; } catch (e) { id = ''; }
      }
      if (!id || !/^[A-Za-z0-9_-]{8,64}$/.test(id)) id = newPlayerId();
      S.playerId = id;
      try { localStorage.setItem(PID_KEY, id); } catch (e) {}
      return id;
    }
    function bumpBestFloor() {
      S.bestFloor = Math.max(1, S.bestFloor || 1, S.stage || 1);
      return S.bestFloor;
    }
    function playerPower() {
      return Math.max(0, Math.round(
        playerAtk() * 10 + playerDef() * 12 + playerMaxHp() * 1.5 + (S.level || 1) * 5 +
        playerCritRate(false) * 400 + (playerCritDmg() - 1) * 200 +
        playerHit() * 250 + playerDodge() * 300
      ));
    }
    function lbHeaders() {
      return {
        apikey: LB_KEY,
        Authorization: 'Bearer ' + LB_KEY,
        'Content-Type': 'application/json',
        Accept: 'application/json'
      };
    }
    var lastLbSubmit = 0;
    var lbTimer = 0;
    function submitLeaderboard(opts) {
      opts = opts || {};
      ensurePlayerId();
      bumpBestFloor();
      if (!isValidName(S.playerName)) return Promise.resolve(false);
      var now = Date.now();
      if (!opts.force && !opts.keepalive && now - lastLbSubmit < LB_THROTTLE) return Promise.resolve('throttled');
      lastLbSubmit = now;
      var body = JSON.stringify({
        p_id: S.playerId,
        p_name: sanitizeName(S.playerName),
        p_floor: Math.max(1, S.bestFloor || 1),
        p_power: playerPower(),
        p_level: Math.max(1, S.level || 1)
      });
      var ctrl = null, timer = 0;
      var req = {
        method: 'POST',
        headers: lbHeaders(),
        body: body,
        cache: 'no-store',
        keepalive: !!opts.keepalive
      };
      if (!opts.keepalive && typeof AbortController !== 'undefined') {
        ctrl = new AbortController();
        req.signal = ctrl.signal;
        timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 12000);
      }
      return fetch(LB_URL + '/rest/v1/rpc/submit_score', req).then(function (r) {
        if (timer) clearTimeout(timer);
        if (!r.ok) throw new Error('lb ' + r.status);
        return true;
      }).catch(function () {
        if (timer) clearTimeout(timer);
        return false;
      });
    }
    function fetchLeaderboard() {
      var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 12000) : 0;
      return fetch(LB_URL + '/rest/v1/leaderboard?select=player_id,name,max_floor,power,level,updated_at&order=max_floor.desc,power.desc&limit=50', {
        method: 'GET',
        headers: lbHeaders(),
        cache: 'no-store',
        signal: ctrl ? ctrl.signal : undefined
      }).then(function (r) {
        if (timer) clearTimeout(timer);
        if (!r.ok) throw new Error('lb ' + r.status);
        return r.json();
      }).then(function (rows) {
        return Array.isArray(rows) ? rows : [];
      }).catch(function () {
        if (timer) clearTimeout(timer);
        return null;
      });
    }
    function formatLbTime(iso) {

          timeZone: 'Asia/Taipei',
          month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit',
          hour12: false
        }).format(d);
        return fmt + '（台北）';
      } catch (e) { return '—'; }
    }

    function writeLocalStorage(raw) {
      try {
        localStorage.setItem(SAVE_KEY, raw);
        return true;
      } catch (e) {
        return false;
      }
    }

    function readLocalStorage() {
      try { return localStorage.getItem(SAVE_KEY); }
      catch (e) { return null; }
    }

    function writeCookie(raw) {
      if (!raw || raw.length > 3500) return false;
      try {
        document.cookie = COOKIE_KEY + '=' + encodeURIComponent(raw) +
          '; path=/; max-age=31536000; SameSite=Lax';
        return document.cookie.indexOf(COOKIE_KEY + '=') !== -1;
      } catch (e) {
        return false;
      }
    }

    function readCookie() {
      try {
        var all = document.cookie ? document.cookie.split(';') : [];
        for (var i = 0; i < all.length; i++) {
          var p = all[i].trim();
          if (p.indexOf(COOKIE_KEY + '=') === 0) {
            return decodeURIComponent(p.slice(COOKIE_KEY.length + 1));
          }
        }
      } catch (e) {}
      return null;
    }

    function clearCookie() {
      try { document.cookie = COOKIE_KEY + '=; path=/; max-age=0'; } catch (e) {}
    }

    function idbOpen() {
      return new Promise(function (resolve, reject) {
        if (!window.indexedDB) { reject(new Error('no idb')); return; }
        var req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = function () {
          var db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error || new Error('idb')); };
      });
    }

    function idbPut(raw) {
      return idbOpen().then(function (db) {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(raw, 'main');
          tx.oncomplete = function () { try { db.close(); } catch (e) {} resolve(true); };
          tx.onerror = function () { try { db.close(); } catch (e) {} reject(tx.error); };
        });
      });
    }

    function idbGet() {
      return idbOpen().then(function (db) {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction(IDB_STORE, 'readonly');
          var req = tx.objectStore(IDB_STORE).get('main');
          req.onsuccess = function () { try { db.close(); } catch (e) {} resolve(req.result || null); };
          req.onerror = function () { try { db.close(); } catch (e) {} reject(req.error); };
        });
      });
    }

    function idbDel() {
      return idbOpen().then(function (db) {
        return new Promise(function (resolve) {
          var tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).delete('main');
          tx.oncomplete = function () { try { db.close(); } catch (e) {} resolve(); };
          tx.onerror = function () { try { db.close(); } catch (e) {} resolve(); };
        });
      }).catch(function () {});
    }

    function updateSaveStatus() {
      var node = el['save-status'];
      if (!node) return;
      if (!storageInfo.ok) {
        node.className = 'save-status bad';
        node.textContent = '此環境無法存檔';
        node.title = '瀏覽器無法保留進度。請用右上角 💾 匯出存檔，換檔開啟時再匯入。';
        return;
      }
      node.className = 'save-status ok';
      var hm = formatHm(storageInfo.lastOk || Date.now());
      node.textContent = '已存檔 ' + hm;
      node.title = '已寫入：' + (storageInfo.backends.join('、') || '本機') + '。若你重新下載遊戲檔，請先匯出存檔。';
    }

    function formatHm(ts) {
      var d = new Date(ts);
      function pad(n) { return (n < 10 ? '0' : '') + n; }
      return pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function save() {
      var raw;
      try { raw = payloadRaw(); }
      catch (e) { storageInfo.ok = false; storageInfo.error = String(e); updateSaveStatus(); return false; }
      var backends = [];
      if (writeLocalStorage(raw)) backends.push('本機');
      if (writeCookie(raw)) backends.push('Cookie');
      idbPut(raw).then(function () {
        if (storageInfo.backends.indexOf('IndexedDB') === -1) storageInfo.backends.push('IndexedDB');
        storageInfo.ok = true;
        storageInfo.lastOk = Date.now();
        updateSaveStatus();
      }).catch(function () {
        updateSaveStatus();
      });
      storageInfo.ok = backends.length > 0;
      storageInfo.backends = backends;
      storageInfo.lastOk = Date.now();
      storageInfo.error = storageInfo.ok ? '' : 'storage-unavailable';
      updateSaveStatus();
      return storageInfo.ok;
    }

    function stampAndSave() {
      lastSeen = Date.now();
      var ok = save();
      if (isValidName(S.playerName)) submitLeaderboard({ keepalive: true });
      return ok;
    }

    function pickNewest(raws) {
      var best = null, bestAt = -1;
      for (var i = 0; i < raws.length; i++) {
        var data = parseSaveRaw(raws[i]);
        if (!data) continue;
        var at = data.savedAt || data.lastSeen || 0;
        if (at >= bestAt) { bestAt = at; best = data; }
      }
      return best;
    }

    function loadSyncCandidates() {
      var raws = [];
      var a = readLocalStorage();
      if (a) raws.push(a);
      var b = readCookie();
      if (b) raws.push(b);
      return raws;
    }

    function load() {
      try {
        var data = pickNewest(loadSyncCandidates());
        if (!data) return false;
        return applyPayload(data);
      } catch (e) {
        return false;
      }
    }

    function loadAll() {
      return idbGet().then(function (raw) {
        var raws = loadSyncCandidates();
        if (raw) raws.push(raw);
        var data = pickNewest(raws);
        if (!data) return false;
        return applyPayload(data);
      }).catch(function () {
        return load();
      });
    }

    function clearAllStorage() {
