    function effectiveOfflineMs(ms) {
      var h = 3600000;
      if (ms <= 2 * h) return ms;
      var t = 2 * h;
      var mid = Math.min(ms - 2 * h, 6 * h);
      t += mid * 0.5;
      if (ms > 8 * h) t += (ms - 8 * h) * 0.25;
      return t;
    }

    function formatDuration(ms) {
      var s = Math.max(0, Math.floor(ms / 1000));
      var h = Math.floor(s / 3600);
      var m = Math.floor((s % 3600) / 60);
      var sec = s % 60;
      if (h > 0) return h + ' 小時 ' + m + ' 分';
      if (m > 0) return m + ' 分 ' + (sec ? sec + ' 秒' : '');
      return sec + ' 秒';
    }

    function fmtNum(n) {
      return Math.round(n).toLocaleString('zh-TW');
    }

    function addExp(n, silent) {
      S.exp += n;
      var ups = 0;
      while (S.exp >= expNeed(S.level)) {
        S.exp -= expNeed(S.level);
        S.level += 1;
        ups += 1;
        S.hp = playerMaxHp();
      }
      if (ups && !silent) {
        sfx('lv');
        log('升級！現在是 Lv.' + S.level + '，生命與能力提升。', 'ok');
        toast('升級！Lv.' + S.level);
        floatText('LEVEL UP', '#f0c75e', true, 0.5);
      }
      return ups;
    }

    function itemPower(g) {
      if (!g) return 0;
      var r = RARITY[g.rarity] ? RARITY[g.rarity].mult : 0;
      return effectiveAtk(g) * 10 + effectiveDef(g) * 12 + effectiveHp(g) * 1.5 +
        effectiveCrit(g) * 400 + effectiveCritDmg(g) * 200 +
        effectiveHit(g) * 250 + effectiveDodge(g) * 300 +
        (g.plus || 0) * 3 + (g.life || 0) * 8 + r;
    }

    function isEquipped(g) {
      if (!g || !S.eq) return false;
      for (var k in S.eq) if (S.eq[k] === g.id) return true;
      return g.id === S.eqW || g.id === S.eqA;
    }

    function weakerThanEquipped(g) {
      if (!g) return false;
      var eq = getEq(itemSlot(g));
      if (!eq) return false;
      return itemPower(g) < itemPower(eq) - 0.01;
    }

    function clearEqId(id) {
      if (!S.eq) S.eq = emptyEq();
      for (var k in S.eq) if (S.eq[k] === id) S.eq[k] = null;
      if (S.eqW === id) S.eqW = null;
      if (S.eqA === id) S.eqA = null;
    }

    function takeFromBag(g) {
      var price = sellPrice(g);
      clearEqId(g.id);
      S.inv = S.inv.filter(function (x) { return x.id !== g.id; });
      S.coins += price;
      return price;
    }

    function placeItem(g) {
      migrateItem(g);
      S.inv.push(g);
      return { kept: true, soldCoins: 0, soldN: 0, soldNames: [], item: g };
    }

    function notifyAutoSell(place, silent) {
      if (!place || !place.soldN) return;
      var msg = '自動出售 ' + place.soldN + ' 件較差裝備，+' + place.soldCoins + ' 金幣';
      if (!silent) {
        log(msg, 'good');
        toast(msg);
      }
    }

    function isManualFight() {
      return S.trainMode === 'manual';
    }

    function gemDropRate(kind, isBoss) {
      if (kind === 'bless') return isBoss ? 0.28 : 0.10;
      if (kind === 'soul') return isBoss ? 0.12 : 0.025;
      if (kind === 'life') return isBoss ? 0.20 : 0.07;
      return 0;
    }
    function rollGemDrops(isBoss, silent, forceKind) {
      var got = [];
      var kinds = forceKind ? [forceKind] : ['bless', 'soul', 'life'];
      for (var i = 0; i < kinds.length; i++) {
        var kind = kinds[i];
        if (forceKind || Math.random() < gemDropRate(kind, isBoss)) {
          addGem(kind, 1);
          got.push(kind);
        }
      }
      if (got.length && !silent) {
        var names = got.map(function (k) { return GEMS[k].name; }).join('、');
        log('掉落寶石：' + names, 'good');
        sfx('chime');
      }
      return got;
    }

    function tryDrop(isBoss, silent) {
      var chance = isBoss ? 0.62 : 0.2;
      if (isManualFight()) chance = Math.min(0.92, chance * 1.5);
      var place = { item: null, soldCoins: 0, soldN: 0, kept: false, gems: [] };
      if (Math.random() <= chance) {
        var g = makeGear(S.stage, isBoss);
        place = placeItem(g);
        notifyAutoSell(place, silent);
        var R = g && RARITY[g.rarity];
        if (place.kept && !silent) {
          log('掉落【' + R.name + '】' + g.name + '（' + itemStatText(g, true) + '）', R.log || 'good');
          sfx('drop');
        }
      }
      place.gems = rollGemDrops(isBoss, silent);
      return place;
    }

    function syncMonsterSprite() {
      if (!monster || !el['monster-wrap']) return;
      el['monster-wrap'].classList.remove('die', 'hit');
      el['monster-wrap'].classList.toggle('boss', !!monster.isBoss);
      el['mhp-bar'].classList.toggle('boss', !!monster.isBoss);
      el['monster-emoji'].textContent = monster.emoji;
      el['monster-name'].textContent = monster.name;
      renderMonsterBar();
    }

    function tplFor(stage, isBoss) {
      if (isBoss) return BOSSES[(stage - 1) % BOSSES.length];
      var pool = MOBS.filter(function (m) { return stage >= m.min; });
      if (!pool.length) pool = MOBS.slice(0, 4);
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function applyOfflineProgress(forcedElapsed) {
      var now = Date.now();
      var elapsed = (forcedElapsed != null) ? forcedElapsed : (lastSeen ? now - lastSeen : 0);
      if (elapsed < OFFLINE_APPLY_MIN) {
        lastSeen = now;
        return null;
      }
      var capped = elapsed >= OFFLINE_CAP;
      var timeLeft = effectiveOfflineMs(Math.min(elapsed, OFFLINE_CAP));
      var hasAuto = S.autoLv > 0 && S.trainMode !== 'manual';
      var interval = hasAuto ? autoInterval() : BASE_OFFLINE_INTERVAL;
      if (!interval) interval = BASE_OFFLINE_INTERVAL;

      var startLevel = S.level;
      var startStage = S.stage;
      var startCoins = S.coins;
      var coinsGained = 0;
      var expGained = 0;
      var kills = 0;
      var bosses = 0;
      var levelsGained = 0;
      var drops = [];
      var bagFull = false;
      var stuck = false;
      var gems = emptyGems();
      var farmed = false;
      var autoSellCoins = 0;

      if (combatLock && monster && monster.hp <= 0) {
        combatLock = false;
        if (monster.isBoss) { S.stage += 1; S.wave = 1; }
        else S.wave += 1;
        monster = null;
      }

      function fightInfo(hp, st, iv, stage) {
        var pLand = hitChance(playerHit(), st.dodge || 0);
        var mLand = hitChance(st.hit || 0.8, playerDodge());
        var pDps = avgDamage(playerAtk(), st.def, {
          land: pLand, crit: playerCritRate(false), critDmg: playerCritDmg()
        }) / (iv / 1000);
        var mDps = avgDamage(st.atk, playerDef(), { land: mLand, crit: 0, critDmg: 1 }) /
          (monAtkInterval(stage) / 1000);
        var ttk = hp / Math.max(0.001, pDps);
        var tdie = playerMaxHp() / Math.max(0.001, mDps);
        return { pDps: pDps, ttk: ttk, tdie: tdie, can: ttk < tdie * 0.95 };
      }

      function ensureMonster(isBoss, st, hp) {
        if (monster && monster.hp > 0) return;
        var tplS = tplFor(S.stage, isBoss);
        monster = {
          name: isBoss ? ('首領・' + tplS.name) : tplS.name,
          emoji: tplS.emoji, isBoss: isBoss,
          hp: hp, maxHp: st.hp, atk: st.atk, def: st.def, coins: st.coins, exp: st.exp,
          hit: st.hit, dodge: st.dodge
        };
      }

      function grantOfflineKill(st, isBoss) {
        coinsGained += st.coins;
        expGained += st.exp;
        S.coins += st.coins;
        levelsGained += addExp(st.exp, true);
        S.kills += 1;
        kills += 1;
        if (isBoss) { S.bossKills += 1; bosses += 1; }
        var dropRes = tryDrop(isBoss, true);
        if (dropRes && dropRes.item) drops.push(dropRes.item);
        if (dropRes && dropRes.soldCoins) autoSellCoins += dropRes.soldCoins;
        if (dropRes && dropRes.gems) {
          for (var gi = 0; gi < dropRes.gems.length; gi++) gems[dropRes.gems[gi]] = (gems[dropRes.gems[gi]] || 0) + 1;
        }
      }

      var guard = 0;
      while (timeLeft > 0 && guard++ < 300000) {
        var isBoss = S.wave === WAVES_PER_STAGE;
        var st = monsterStats(S.stage, isBoss, false);
        var hp;
        if (monster && monster.hp > 0) {
          hp = monster.hp;
          st.atk = monster.atk; st.def = monster.def;
          st.coins = monster.coins; st.exp = monster.exp;
          if (monster.hit != null) st.hit = monster.hit;
          if (monster.dodge != null) st.dodge = monster.dodge;
          normalizeMonster(monster);
          st.hp = monster.maxHp || st.hp;
        } else {
          hp = st.hp;
        }

        var ft = fightInfo(hp, st, interval, S.stage);
        if (ft.can) {
          stuck = false;
          var needMs = ft.ttk * 1000;
          if (needMs > timeLeft) {
            var dealt = ft.pDps * (timeLeft / 1000);
            var leftHp = Math.max(1, Math.ceil(hp - dealt));
            ensureMonster(isBoss, st, leftHp);
            monster.hp = leftHp;
            monster.maxHp = st.hp || monster.maxHp || leftHp;
            timeLeft = 0;
            break;
          }
          timeLeft -= needMs;
          grantOfflineKill(st, isBoss);
          if (isBoss) { S.stage += 1; S.wave = 1; }
          else S.wave += 1;
          monster = null;
          continue;
        }

        stuck = true;
        ensureMonster(isBoss, st, hp);
        var farmStage = isBoss ? S.stage : Math.max(1, S.stage - 1);
        var farm = monsterStats(farmStage, false, false);
        var farmIv = Math.max(interval * 3, 800);
        var ff = fightInfo(farm.hp, farm, farmIv, farmStage);
        if (!ff.can) break;
        farmed = true;
        if (ff.ttk * 1000 > timeLeft) {
          timeLeft = 0;
          break;
        }
        timeLeft -= ff.ttk * 1000;
        farm.coins = Math.max(1, Math.round(farm.coins * 0.5));
        farm.exp = Math.max(1, Math.round(farm.exp * 0.25));
        grantOfflineKill(farm, false);
      }

      if (!monster) spawnMonster(true);
      else syncMonsterSprite();

      lastSeen = now;
      bumpBestFloor();
      save();

      var report = {
        elapsed: elapsed,
        applied: effectiveOfflineMs(Math.min(elapsed, OFFLINE_CAP)),
        capped: capped,
        hasAuto: hasAuto,
        autoLv: S.autoLv,
        coins: coinsGained,
        exp: expGained,
        kills: kills,
        bosses: bosses,
        levelsGained: levelsGained,
        startLevel: startLevel,
        endLevel: S.level,
        startStage: startStage,
        endStage: S.stage,
        drops: drops,
        bagFull: bagFull,
        stuck: stuck,
        farmed: farmed,
        autoSellCoins: autoSellCoins,
        gems: gems,
        trainMode: S.trainMode,
        showPopup: elapsed >= OFFLINE_POPUP_MIN
      };
      return report;
    }

    function showOfflinePopup(r) {
      if (!r || !el.modal) return;
      var rows = '';
      rows += '<div class="row-s"><span>離開時間</span><span>' + formatDuration(r.elapsed) + '</span></div>';
      if (r.capped) rows += '<div class="row-s"><span>結算上限</span><span>24 小時</span></div>';
      rows += '<div class="row-s"><span>擊敗魔物</span><span>' + fmtNum(r.kills) + ' 隻' + (r.bosses ? '（含首領 ' + r.bosses + '）' : '') + '</span></div>';
      rows += '<div class="row-s"><span>獲得金幣</span><span>🪙 ' + fmtNum(r.coins) + '</span></div>';
      if (r.autoSellCoins) rows += '<div class="row-s"><span>自動出售裝備</span><span>🪙 ' + fmtNum(r.autoSellCoins) + '</span></div>';
      rows += '<div class="row-s"><span>獲得經驗</span><span>' + fmtNum(r.exp) + '</span></div>';
      if (r.levelsGained) rows += '<div class="row-s"><span>升級</span><span>' + r.levelsGained + ' 次（現在 Lv.' + r.endLevel + '）</span></div>';
      if (r.endStage > r.startStage) rows += '<div class="row-s"><span>層數</span><span>第 ' + r.startStage + ' 層 → 第 ' + r.endStage + ' 層</span></div>';
      var dropHtml = '';
      if (r.drops && r.drops.length) {
        var names = r.drops.slice(0, 4).map(function (g) {
          return '<span style="color:' + RARITY[g.rarity].color + '">【' + RARITY[g.rarity].name + '】' + esc(g.name) + '</span>';
        }).join('、');
        if (r.drops.length > 4) names += ' 等 ' + r.drops.length + ' 件';
        dropHtml = '<div class="drops">掉落裝備：' + names + '</div>';
      }
      if (r.gems && (r.gems.bless || r.gems.soul || r.gems.life)) {
        var gemBits = [];
        if (r.gems.bless) gemBits.push('祝福寶石 ×' + r.gems.bless);
        if (r.gems.soul) gemBits.push('靈魂寶石 ×' + r.gems.soul);
        if (r.gems.life) gemBits.push('生命寶石 ×' + r.gems.life);
        dropHtml += '<div class="drops">掉落寶石：' + gemBits.join('、') + '</div>';
      }
      var notes = '';
      if (r.trainMode === 'manual') {
        notes += '<p class="offline-note warn">離開時為「手動練功」模式，本次僅計算少量基礎掛機收益。切換為自動練功（需已解鎖）後，離線收益會大幅提升。</p>';
      } else if (!r.hasAuto) {
        notes += '<p class="offline-note warn">尚未解鎖自動攻擊，本次僅獲得少量基礎掛機收益。到商店解鎖自動攻擊並使用「自動練功」後，離開時的練功速度會大幅提升。</p>';
      } else {
        notes += '<p class="offline-note">已依自動練功、自動攻擊 Lv.' + r.autoLv + ' 的傷害效率結算離線進度。</p>';
      }
      if (r.stuck) {
        notes += '<p class="offline-note">推進在第 ' + r.endStage + ' 層暫時停下（戰力尚不足以穩定擊敗眼前魔物）。離線期間不會陣亡' +
          (r.farmed ? '，並改為在可擊敗的魔物身上繼續練功。' : '。') + '</p>';
      }
      var rawUse = Math.min(r.elapsed, 24 * 3600000);
      if (r.capped || (r.applied != null && r.applied < rawUse - 5000)) {
        notes += '<p class="offline-note">長時間掛機的收益效率會逐漸下降' + (r.capped ? '，最多計算 24 小時' : '') + '。</p>';
      }
      if (r.kills === 0 && !r.stuck) {
        notes += '<p class="offline-note">時間較短或尚在戰鬥中，沒有完成擊殺。</p>';
      }
      el.modal.innerHTML = '<div class="modal-card offline-card" id="offline-card">' +
        '<h3>掛機歸來</h3>' +
        '<p>歡迎回來，冒險者。</p>' +
        '<div class="offline-stats">' + rows + dropHtml + '</div>' +
        notes +
        '<div class="modal-actions"><button type="button" id="btn-offline-ok">繼續冒險</button></div></div>';
      el.modal.classList.add('show');
      var ok = document.getElementById('btn-offline-ok');
      if (ok) ok.onclick = function () {
        unlockAudio();
        el.modal.classList.remove('show');
        stampAndSave();
      };
      log('掛機歸來：離開 ' + formatDuration(r.elapsed) + '，擊敗 ' + r.kills + ' 隻，🪙' + fmtNum(r.coins) + '，經驗 ' + fmtNum(r.exp) + '。', 'ok');
    }

    function onMonsterDead() {
      if (combatLock) return;
      combatLock = true;
      var m = monster;
      el['monster-wrap'].classList.add('die');
      sfx(m.isBoss ? 'win' : 'coin');
      S.coins += m.coins;
      S.kills += 1;
      if (m.isBoss) S.bossKills += 1;
      addExp(m.exp);
      log('擊敗「' + m.name + '」！獲得 🪙' + m.coins + '、經驗 ' + m.exp, 'good');
      floatText('+' + m.coins + ' 金幣', '#f0c75e', false, 0.55);
      var rec = el.arena.getBoundingClientRect();
      burst(rec.width * 0.5, rec.height * 0.4, m.isBoss ? '#ffb14a' : '#f0c75e', m.isBoss ? 28 : 14);
      tryDrop(m.isBoss);

      var nextWave = S.wave + 1;
      var nextStage = S.stage;
      var cleared = false;
      if (m.isBoss) {
        nextStage = S.stage + 1;
        nextWave = 1;
        cleared = true;
      }

      setTimeout(function () {
        if (cleared) {
          S.stage = nextStage;
          S.wave = 1;
          bumpBestFloor();
          showBanner('進入第 ' + S.stage + ' 層');
          log('層層深入…來到第 ' + S.stage + ' 層。', 'ok');
        } else {
          S.wave = nextWave;
        }
        if (m.isBoss || cleared) submitLeaderboard({ force: true });
        combatLock = false;
        spawnMonster();
        save();
        renderAll();
      }, (S.autoLv > 0 && S.trainMode === 'auto') ? 150 : 320);

      renderAll();
    }

    function playerDie() {
      if (combatLock) return;
      combatLock = true;
      var lost = Math.floor(S.coins * 0.25);
      S.coins -= lost;
      S.hp = 0;
      sfx('dead');
      log('你被擊敗了…失去 🪙' + lost + '。', 'bad');
      S.wave = 1;
      S.hp = playerMaxHp();
      var html = '<div class="modal-card">' +
        '<h3>陣 亡</h3>' +
        '<p>你在第 ' + S.stage + ' 層倒下了。</p>' +
        '<p class="sub">失去 🪙 ' + lost + ' 金幣（25%）<br>將在本層入口重整旗鼓。</p>' +
        '<div class="modal-actions"><button type="button" id="btn-revive">重新挑戰</button></div>' +
        '</div>';
      el.modal.innerHTML = html;
      el.modal.classList.add('show');
      document.getElementById('btn-revive').onclick = function () {
        unlockAudio();
        el.modal.classList.remove('show');
        combatLock = false;
        spawnMonster();
        save();
        renderAll();
        log('你在第 ' + S.stage + ' 層入口甦醒。', '');
      };
      save();
      renderAll();
    }

    var combatRolls = [];
    function nextRoll() {
      if (combatRolls.length) return combatRolls.shift();
      return Math.random();
    }
    function setCombatRolls(arr) { combatRolls = (arr || []).slice(); }

    function doPlayerAttack(auto) {
      if (combatLock || !monster || monster.hp <= 0) return;
      if (S.hp <= 0) return;
      if (document.hidden) return;
      var now = performance.now();
      if (!auto && now - lastAtk < ATK_CD) return;
      lastAtk = now;
      var manual = !auto && S.trainMode === 'manual';
      normalizeMonster(monster);
      var land = hitChance(playerHit(), monster.dodge || 0);
      if (nextRoll() >= land) {
        var showMiss = !auto || (now - lastAutoFx >= 150);
        if (showMiss) {
          lastAutoFx = now;
          sfx('miss');
          floatText('MISS', '#9aa4b8', false, null, 'miss');
        }
        return 'miss';
      }
      var crit = nextRoll() < playerCritRate(manual);
      var dmg = calcDmg(playerAtk(), monster.def, crit, playerCritDmg());
      if (manual) dmg = Math.max(1, Math.round(dmg * 1.35));
      monster.hp -= dmg;
      var showFx = !auto || crit || (now - lastAutoFx >= 150);
      if (showFx) {
        lastAutoFx = now;
        sfx(crit ? 'crit' : 'hit');
        floatText((crit ? '暴擊 ' : '') + dmg, crit ? '#ffd24a' : '#fff7e8', crit);
        el['monster-wrap'].classList.remove('hit');
        void el['monster-wrap'].offsetWidth;
        el['monster-wrap'].classList.add('hit');
        if (!auto || crit) {
          var rec = el.arena.getBoundingClientRect();
          burst(rec.width * 0.5, rec.height * 0.38, crit ? '#ffd24a' : '#ffe8c0', auto ? 6 : (crit ? 16 : 8));
        }
      }
      renderMonsterBar();
      if (monster.hp <= 0) {
        monster.hp = 0;
        renderMonsterBar();
        onMonsterDead();
      }
      return crit ? 'crit' : 'hit';
    }

    function doMonsterAttack() {
      if (document.hidden) return;
      if (combatLock || !monster || monster.hp <= 0 || S.hp <= 0) return;
      normalizeMonster(monster);
      if (nextRoll() >= hitChance(monster.hit || 0.8, playerDodge())) {
        sfx('evade');
        floatText('閃避', '#6ee0c4', false, 0.22, 'evade');
        return 'evade';
      }
      var dmg = calcDmg(monster.atk, playerDef(), false);
      S.hp -= dmg;
      sfx('hurt');
      floatText('-' + dmg, '#ff6d6d', false, 0.22);
      if (S.hp < 0) S.hp = 0;
      renderHero();
      if (S.hp <= 0) playerDie();
      return 'hurt';
    }

    function renderHero() {
      var maxh = playerMaxHp();
      el['hp-fill'].style.width = (Math.max(0, S.hp) / maxh * 100) + '%';
      el['hp-text'].textContent = '生命 ' + Math.max(0, Math.ceil(S.hp)) + ' / ' + maxh;
      var need = expNeed(S.level);
      el['exp-fill'].style.width = (S.exp / need * 100) + '%';
      el['exp-text'].textContent = '經驗 ' + S.exp + ' / ' + need;
      el['stat-atk'].textContent = String(playerAtk());
      el['stat-def'].textContent = String(playerDef());
      if (el['stat-crit']) el['stat-crit'].textContent = Math.round(playerCritRate(false) * 100) + '%';
      if (el['stat-cdmg']) el['stat-cdmg'].textContent = Math.round(playerCritDmg() * 100) + '%';
      if (el['stat-hit']) el['stat-hit'].textContent = fmtPct(playerHit());
      if (el['stat-dodge']) el['stat-dodge'].textContent = fmtPct(playerDodge());
      if (el['stat-panel']) {
        el['stat-panel'].innerHTML =
          '<div>攻擊 <b>' + playerAtk() + '</b></div>' +
          '<div>防禦 <b>' + playerDef() + '</b></div>' +
          '<div>生命上限 <b>' + playerMaxHp() + '</b></div>' +
          '<div>暴擊 <b>' + fmtPct(playerCritRate(false)) + '</b></div>' +
          '<div>爆擊傷害 <b>' + Math.round(playerCritDmg() * 100) + '%</b></div>' +
          '<div>命中 <b>' + fmtPct(playerHit()) + '</b></div>' +
          '<div>閃避 <b>' + fmtPct(playerDodge()) + '</b></div>' +
          '<div>戰力 <b>' + playerPower() + '</b></div>' +
          '<div>手動暴擊 <b>' + fmtPct(playerCritRate(true)) + '</b></div>';
      }
      el.lv.textContent = 'Lv.' + S.level;
      el['stage-label'].textContent = '第 ' + S.stage + ' 層';
      var wlabel = S.wave === WAVES_PER_STAGE ? '首領戰' : ('怪物 ' + S.wave + ' / ' + WAVES_PER_STAGE);
      el['wave-label'].textContent = wlabel;
      el.coins.textContent = '🪙 ' + S.coins;
      el['btn-mute'].textContent = S.mute ? '🔇' : '🔊';
      renderPlayerChip();
      var as = el['auto-status'];
      if (S.trainMode === 'manual') {
        as.className = 'on';
        as.innerHTML = '手動練功<br><b>+35% 傷害</b>';
      } else if (S.autoLv <= 0) {
        as.className = '';
        as.innerHTML = '自動攻擊<br><b>未解鎖</b>';
      } else {
        as.className = 'on';
        as.innerHTML = '自動攻擊<br><b>Lv.' + S.autoLv + '</b>';
      }
      updateModeUI();
    }

    function updateModeUI() {
      var bar = el['mode-toggle'];
      if (!bar) return;
      var buttons = bar.querySelectorAll('button');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.toggle('on', buttons[i].getAttribute('data-mode') === S.trainMode);
      }
      var hint = el['mode-hint'];
      if (!hint) return;
      if (S.trainMode === 'manual') {
        hint.textContent = '點擊攻擊有額外傷害與掉落率，離線僅少量收益。';
      } else if (S.autoLv <= 0) {
        hint.textContent = '到商店解鎖自動攻擊後即可掛機。';
      } else {
        hint.textContent = '自動攻擊進行中，離開也會練功。';
      }
    }

    function setTrainMode(mode) {
      S.trainMode = mode === 'manual' ? 'manual' : 'auto';
      autoTimer = 0;
      save();
      renderHero();
      toast(S.trainMode === 'manual' ? '已切換為手動練功' : '已切換為自動練功');
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }

    function itemStatText(g, compact) {
      if (!g) return '';
      var bits = [];
      var atk = effectiveAtk(g), def = effectiveDef(g), hp = effectiveHp(g), crit = effectiveCrit(g);
      var hit = effectiveHit(g), dodge = effectiveDodge(g), cd = effectiveCritDmg(g);
      if (atk) bits.push('攻擊 +' + atk);
      if (def) bits.push('防禦 +' + def);
      if (hp) bits.push('生命 +' + hp);
      if (crit) bits.push('暴擊 +' + Math.round(crit * 1000) / 10 + '%');
      if (cd) bits.push('爆傷 +' + Math.round(cd * 1000) / 10 + '%');
      if (hit) bits.push('命中 +' + Math.round(hit * 1000) / 10 + '%');
      if (dodge) bits.push('閃避 +' + Math.round(dodge * 1000) / 10 + '%');
      var extra = [];
      if (g.plus) extra.push('<span class="plus-tag">+' + g.plus + '</span>');
      if (g.life) extra.push('<span class="life-tag">生命+' + g.life + '</span>');
      var body = bits.join(compact ? ' ' : '　');
      return body + (extra.length ? (body ? '　' : '') + extra.join(' ') : '');
    }

    function gemBarHtml() {
      var html = '<div class="gem-bar">';
      ['bless', 'soul', 'life'].forEach(function (k) {
        var G = GEMS[k];
        html += '<span class="gem-pill" style="color:' + G.color + '">' + G.ico + ' ' + G.name + ' ×' + gemCount(k) + '</span>';
      });
      html += '</div>';
      return html;
    }

    function slotCellHtml(slot, opts) {
      opts = opts || {};
      var info = slotInfo(slot);
      var g = getEq(slot);
      var cls = 'slot-cell' + (g && RARITY[g.rarity] ? ' ' + RARITY[g.rarity].cls : ' r-common') + (g ? '' : ' empty');
      if (opts.pick) cls += ' pick';
      if (opts.selected) cls += ' selected';
      var open = opts.pick
        ? ('<button type="button" class="' + cls + '" data-enh-slot="' + slot + '">')
        : ('<div class="' + cls + '">');
      var close = opts.pick ? '</button>' : '</div>';
      var name, stats;
      if (!g) {
        name = '未裝備';
        stats = '點擊背包裝備此部位';
      } else {
        var R = RARITY[g.rarity];
        name = '<span style="color:' + R.color + '">' + esc(g.name) + '</span>';
        stats = '【' + R.name + '】' + itemStatText(g, true);
      }
      return open +
        '<div class="ico">' + info.ico + '</div>' +
        '<div class="meta"><div class="slabel">' + info.name + '</div>' +
        '<div class="iname">' + name + '</div>' +
        '<div class="istats">' + stats + '</div></div>' +
        close;
    }

    function renderBag() {
      var html = '<h2>目前裝備</h2>';
      html += '<div class="slot-grid">';
      for (var s = 0; s < SLOT_DEFS.length; s++) html += slotCellHtml(SLOT_DEFS[s].id);
      html += '</div>';
      html += '<h2>寶石</h2>' + gemBarHtml();
      html += '<h2>背包（' + S.inv.length + '）</h2>';
      html += '<p class="hint">打怪掉落八部位裝備與寶石。一鍵穿裝會把舊裝備的強化自動繼承到新裝備（免費、來源重置為 +0）。也可手動把強化繼承到同部位裝備。</p>';
      html += '<div class="bag-tools">';
      html += '<button type="button" class="mini' + (bagSort === 'power' ? ' on' : '') + '" data-sort="power">依強度</button>';
      html += '<button type="button" class="mini' + (bagSort === 'rarity' ? ' on' : '') + '" data-sort="rarity">依稀有度</button>';
      html += '<button type="button" class="mini' + (bagSort === 'type' ? ' on' : '') + '" data-sort="type">依類型</button>';
      html += '<button type="button" class="mini ok" id="btn-auto-equip">一鍵穿裝</button>';
      html += '<button type="button" class="mini warn" id="btn-sell-junk">一鍵出售較差裝備</button>';
      html += '</div>';
      html += '<div class="bag-tools">';
      html += '<button type="button" class="mini' + (bagFilter === 'all' ? ' on' : '') + '" data-filter="all">全部</button>';
      for (var f = 0; f < SLOT_DEFS.length; f++) {
        var si = SLOT_DEFS[f];
        html += '<button type="button" class="mini' + (bagFilter === si.id ? ' on' : '') + '" data-filter="' + si.id + '">' + si.name + '</button>';
      }
      html += '</div>';
      var list = S.inv.filter(function (g) { return bagFilter === 'all' || itemSlot(g) === bagFilter; });
      if (!S.inv.length) {
        html += '<div class="empty">背包空空如也，去打怪碰碰運氣吧。</div>';
      } else if (!list.length) {
        html += '<div class="empty">這個部位目前沒有裝備。</div>';
      } else {
        var sorted = list.slice().sort(cmpBag);
        var shown = Math.min(bagShown, sorted.length);
        var lastGroup = '';
        for (var i = 0; i < shown; i++) {
          if (bagSort === 'type') {
            var grp = itemSlot(sorted[i]);
            if (grp !== lastGroup) {
              lastGroup = grp;
              var inf = slotInfo(grp);
              html += '<div class="bag-group">' + (inf ? inf.ico + ' ' + inf.name : grp) + '</div>';
            }
          }
          html += itemRow(sorted[i]);
        }
        if (shown < sorted.length) {
          html += '<button type="button" class="mini bag-more" id="btn-bag-more">顯示更多（尚有 ' + (sorted.length - shown) + ' 件）</button>';
        }
      }
      el['bag-body'].innerHTML = html;
      bindBagBtns();
    }

    function cmpBag(x, y) {
      var o = { legendary: 0, epic: 1, rare: 2, common: 3 };
      var ox = slotOrder(itemSlot(x));
      var oy = slotOrder(itemSlot(y));
      if (bagSort === 'type') {
        if (ox !== oy) return ox - oy;
        return itemPower(y) - itemPower(x);
      }
      if (bagSort === 'rarity') {
        return (o[x.rarity] - o[y.rarity]) || (itemPower(y) - itemPower(x));
      }
      return itemPower(y) - itemPower(x);
    }
    function slotOrder(id) {
      for (var i = 0; i < SLOT_DEFS.length; i++) if (SLOT_DEFS[i].id === id) return i;
      return 99;
    }

    function itemRow(g) {
      var R = RARITY[g.rarity];
      var info = slotInfo(itemSlot(g)) || SLOT_DEFS[0];
      var equipped = isEquipped(g);
      var price = sellPrice(g);
      return '<div class="item compact ' + R.cls + '">' +
        '<div class="ico">' + info.ico + '</div>' +
        '<div class="meta"><div class="iname" style="color:' + R.color + '">' + esc(g.name) +
        (equipped ? '<span class="equipped-tag">已裝備</span>' : '') + '</div>' +
        '<div class="istats">【' + R.name + '・' + info.name + '】' + itemStatText(g, true) + '　售價 🪙' + price + '</div></div>' +
        '<div class="actions">' +
        (equipped
          ? '<button class="mini" data-uneq="' + g.id + '">卸下</button>'
          : '<button class="mini ok" data-eq="' + g.id + '">裝備</button>') +
        ((g.plus || g.life) ? '<button class="mini" data-inherit="' + g.id + '">繼承強化到…</button>' : '') +
        '<button class="mini warn" data-sell="' + g.id + '">出售</button>' +
        '</div></div>';
    }

    function sellPrice(g) {
      var R = RARITY[g.rarity] || RARITY.common;
      var core = effectiveAtk(g) + effectiveDef(g) + effectiveHp(g) * 0.15 + effectiveCrit(g) * 40 +
        effectiveHit(g) * 20 + effectiveDodge(g) * 24 + effectiveCritDmg(g) * 16;
      return Math.max(8, Math.round((8 + (g.stage || 1) * 3 + core * 1.8) * (R.mult * 0.55)));
    }

    function bindBagBtns() {
      el['bag-body'].querySelectorAll('[data-eq]').forEach(function (b) {
        b.onclick = function () { equipItem(+b.getAttribute('data-eq')); };
      });
      el['bag-body'].querySelectorAll('[data-uneq]').forEach(function (b) {
        b.onclick = function () { unequipItem(+b.getAttribute('data-uneq')); };
      });
      el['bag-body'].querySelectorAll('[data-sell]').forEach(function (b) {
        b.onclick = function () { sellItem(+b.getAttribute('data-sell')); };
      });
      el['bag-body'].querySelectorAll('[data-sort]').forEach(function (b) {
        b.onclick = function () { bagSort = b.getAttribute('data-sort'); bagShown = BAG_PAGE; renderBag(); };
      });
      el['bag-body'].querySelectorAll('[data-filter]').forEach(function (b) {
        b.onclick = function () { bagFilter = b.getAttribute('data-filter'); bagShown = BAG_PAGE; renderBag(); };
      });
      el['bag-body'].querySelectorAll('[data-inherit]').forEach(function (b) {
        b.onclick = function () { showInheritPicker(+b.getAttribute('data-inherit')); };
      });
      var autoEq = document.getElementById('btn-auto-equip');
      if (autoEq) autoEq.onclick = autoEquipBest;
      var junk = document.getElementById('btn-sell-junk');
      if (junk) junk.onclick = sellWorseItems;
      var more = document.getElementById('btn-bag-more');
      if (more) more.onclick = function () { bagShown += BAG_PAGE; renderBag(); };
    }

    function anyEquipped() {
      for (var i = 0; i < SLOT_DEFS.length; i++) if (getEq(SLOT_DEFS[i].id)) return true;
      return false;
    }

    function sellWorseItems() {
      if (!anyEquipped()) {
        toast('請先裝備至少一件裝備，才能比較較差裝備');
        return;
      }
      var list = S.inv.filter(function (g) { return !isEquipped(g) && weakerThanEquipped(g); });
      if (!list.length) {
        toast('沒有弱於已裝備的物品');
        return;
      }
      var total = 0;
      for (var i = 0; i < list.length; i++) total += takeFromBag(list[i]);
      clampHp();
      save();
      renderAll();
      toast('已出售 ' + list.length + ' 件較差裝備，+' + total + ' 金幣');
      log('一鍵出售較差裝備 ' + list.length + ' 件，+' + total + ' 金幣。', 'good');
      sfx('coin');
    }

    function syncLegacyEq() {
      if (!S.eq) S.eq = emptyEq();
      S.eqW = S.eq.weapon || null;
      S.eqA = S.eq.armor || null;
    }

    function inheritCost(src) {
      if (!src) return 20;
      return 20 + (src.plus || 0) * 12 + (src.life || 0) * 25;
    }
    function inheritEnhance(srcId, dstId, opts) {
      opts = opts || {};
      var src = findItem(srcId), dst = findItem(dstId);
      if (!src || !dst) return { ok: false, reason: 'noitem' };
      if (src.id === dst.id) return { ok: false, reason: 'same' };
      if (itemSlot(src) !== itemSlot(dst)) return { ok: false, reason: 'slot' };
      var sp = src.plus || 0, sl = src.life || 0;
      var dp = dst.plus || 0, dl = dst.life || 0;
      if (!sp && !sl) return { ok: false, reason: 'empty' };
      var newPlus = Math.max(sp, dp), newLife = Math.max(sl, dl);
      if (newPlus === dp && newLife === dl && !opts.force) {
        return { ok: false, reason: 'noupgrade', plus: newPlus, life: newLife };
      }
      var cost = opts.free ? 0 : inheritCost(src);
      if (!opts.free && S.coins < cost) return { ok: false, reason: 'coins', cost: cost };
      if (!opts.free) S.coins -= cost;
      dst.plus = newPlus;
      dst.life = newLife;
      src.plus = 0;
      src.life = 0;
      clampHp();
      save();
      if (!opts.silent) {
        renderAll();
        toast('已將強化繼承到「' + dst.name + '」：+' + newPlus + (newLife ? ' 生命+' + newLife : '') + '（-' + cost + ' 金幣）', 2200);
        log('強化繼承：' + src.name + ' → ' + dst.name + '（+' + newPlus + (newLife ? ' 生命+' + newLife : '') + '，來源重置為 +0）', 'ok');
        sfx('ok');
      }
      return { ok: true, plus: newPlus, life: newLife, cost: cost, src: src, dst: dst };
    }
    function enhanceLabel(g) {
      return '+' + (g.plus || 0) + ((g.life) ? ' 生命+' + g.life : '');
    }
    function showInheritPicker(srcId) {
      var src = findItem(srcId);
      if (!src) return;
      if (!(src.plus || src.life)) { toast('這件裝備沒有可繼承的強化'); return; }
      var slot = itemSlot(src);
      var info = slotInfo(slot);
      var cost = inheritCost(src);
      var targets = S.inv.filter(function (g) { return g.id !== src.id && itemSlot(g) === slot; });
      if (!targets.length) { toast('背包裡沒有同部位（' + (info ? info.name : slot) + '）可繼承的目標'); return; }
      targets.sort(function (a, b) { return itemPower(b) - itemPower(a); });
      var html = '<div class="modal-card" style="text-align:left"><h3>繼承強化到…</h3>';
      html += '<p>把「' + esc(src.name) + '」的 <b>' + enhanceLabel(src) + '</b> 轉移到同部位裝備。來源會留在背包並重置為 +0，成功機率 100%。花費 <b>🪙 ' + cost + '</b>。</p>';
      html += '<div class="inherit-list">';
      for (var i = 0; i < targets.length; i++) {
        var t = targets[i];
        var R = RARITY[t.rarity];
        var np = Math.max(src.plus || 0, t.plus || 0);
        var nl = Math.max(src.life || 0, t.life || 0);
        var noUp = np === (t.plus || 0) && nl === (t.life || 0);
        var note = noUp
          ? '目標已同樣或更高，繼承不會提升'
          : ('繼承後：+' + np + (nl ? ' 生命+' + nl : ''));
        html += '<button type="button" class="inherit-pick ' + R.cls + '" data-inh-to="' + t.id + '"' + (noUp ? ' data-noup="1"' : '') + '>';
        html += '<div style="color:' + R.color + '">' + esc(t.name) + (isEquipped(t) ? ' <span class="equipped-tag">已裝備</span>' : '') + '</div>';
        html += '<div class="sub">目前 ' + enhanceLabel(t) + '　' + itemStatText(t, true) + '<br>' + note + '</div>';
        html += '</button>';
      }
      html += '</div><button type="button" class="ghost" id="inh-cancel">取消</button></div>';
      el.modal.innerHTML = html;
      el.modal.classList.add('show');
      document.getElementById('inh-cancel').onclick = function () { el.modal.classList.remove('show'); };
      el.modal.querySelectorAll('[data-inh-to]').forEach(function (b) {
        b.onclick = function () {
          var tid = +b.getAttribute('data-inh-to');
          if (b.getAttribute('data-noup') === '1') {
            toast('目標強化已同樣或更高，取消繼承以免重置來源');
            return;
          }
          el.modal.classList.remove('show');
          var r = inheritEnhance(srcId, tid);
          if (!r.ok) {
            if (r.reason === 'coins') toast('金幣不足，需要 🪙 ' + r.cost);
            else if (r.reason === 'noupgrade') toast('目標強化已同樣或更高，沒有繼承');
            else toast('無法繼承');
          }
        };
      });
    }
    function showInheritOnEquip(oldItem, newItem) {
      var cost = inheritCost(oldItem);
      var np = Math.max(oldItem.plus || 0, newItem.plus || 0);
      var nl = Math.max(oldItem.life || 0, newItem.life || 0);
      var noUp = np === (newItem.plus || 0) && nl === (newItem.life || 0);
      var html = '<div class="modal-card" style="text-align:left"><h3>繼承舊裝備強化？</h3>';
      html += '<p>目前裝備的「' + esc(oldItem.name) + '」有 <b>' + enhanceLabel(oldItem) + '</b>。</p>';
      html += '<p>要繼承到「' + esc(newItem.name) + '」嗎？結果為 <b>+' + np + (nl ? ' 生命+' + nl : '') + '</b>，花費 <b>🪙 ' + cost + '</b>。舊裝備會留在背包並重置為 +0。</p>';
      if (noUp) html += '<p class="inherit-warn">新裝備強化已同樣或更高，繼承不會再提升。</p>';
      html += '<div class="row" style="margin-top:12px">';
      if (!noUp) html += '<button type="button" class="ok" id="inh-eq-yes">繼承並裝備</button>';
      html += '<button type="button" id="inh-eq-only">只裝備</button>';
      html += '<button type="button" class="ghost" id="inh-eq-no">取消</button></div></div>';
      el.modal.innerHTML = html;
      el.modal.classList.add('show');
      document.getElementById('inh-eq-no').onclick = function () { el.modal.classList.remove('show'); };
      document.getElementById('inh-eq-only').onclick = function () {
        el.modal.classList.remove('show');
        equipItem(newItem.id, { skipInherit: true });
      };
      var yes = document.getElementById('inh-eq-yes');
      if (yes) yes.onclick = function () {
        el.modal.classList.remove('show');
        var r = inheritEnhance(oldItem.id, newItem.id, { silent: true });
        if (!r.ok && r.reason === 'coins') {
          toast('金幣不足（需要 🪙 ' + r.cost + '），改為只裝備');
        } else if (r.ok) {
          toast('已繼承強化並裝備「' + newItem.name + '」：+' + r.plus + (r.life ? ' 生命+' + r.life : '') + '（-' + r.cost + ' 金幣）', 2200);
          log('強化繼承並裝備：' + oldItem.name + ' → ' + newItem.name, 'ok');
        }
        equipItem(newItem.id, { skipInherit: true });
      };
    }
    function itemPowerAfterInherit(g, from) {
      if (!g) return 0;
      if (!from || from.id === g.id) return itemPower(g);
      var tmp = {};
      for (var k in g) tmp[k] = g[k];
      tmp.plus = Math.max(g.plus || 0, from.plus || 0);
      tmp.life = Math.max(g.life || 0, from.life || 0);
      return itemPower(tmp);
    }
    function bestInSlotAfterInherit(slot, equipped) {
      var best = null, bp = -1;
      for (var i = 0; i < S.inv.length; i++) {
        var g = S.inv[i];
        if (itemSlot(g) !== slot) continue;
        var pw = itemPowerAfterInherit(g, equipped);
        if (pw > bp) { bp = pw; best = g; }
      }
      return best;
    }
    function autoEquipBest() {
      if (!S.eq) S.eq = emptyEq();
      var changes = [];
      for (var i = 0; i < SLOT_DEFS.length; i++) {
        var info = SLOT_DEFS[i];
        var slot = info.id;
        var cur = getEq(slot);
        var best = bestInSlotAfterInherit(slot, cur);
        if (!best) continue;
        if (cur && cur.id === best.id) continue;
        var curPw = cur ? itemPower(cur) : -1;
        var bestPw = itemPowerAfterInherit(best, cur);
        if (bestPw <= curPw + 0.01) continue;
        var line = info.name + ' 已更換';
        if (cur && (cur.plus || cur.life)) {
          var r = inheritEnhance(cur.id, best.id, { silent: true, free: true, force: true });
          if (r.ok) {
            line += '，繼承 +' + r.plus + (r.life ? '、生命+' + r.life : '');
          } else {
            line += '「' + best.name + '」';
          }
        } else {
          line += '「' + best.name + '」';
        }
        S.eq[slot] = best.id;
        changes.push(line);
      }
      syncLegacyEq();
      clampHp();
      save();
      renderAll();
      if (!changes.length) {
        toast('目前已是各部位最強裝備');
        return { changed: 0, changes: [] };
      }
      toast('已一鍵穿裝：' + changes.join('；'), 3200);
      log('一鍵穿裝：' + changes.join('；'), 'ok');
      sfx('ok');
      return { changed: changes.length, changes: changes };
    }

    function equipItem(id, opts) {
      opts = opts || {};
      var g = findItem(id);
      if (!g) return;
      var slot = itemSlot(g);
      if (!S.eq) S.eq = emptyEq();
      var old = getEq(slot);
      if (!opts.skipInherit && old && old.id !== g.id && (old.plus || old.life)) {
        showInheritOnEquip(old, g);
        return;
      }
      S.eq[slot] = id;
      syncLegacyEq();
      clampHp();
      save();
      renderAll();
      toast('已裝備 ' + g.name);
      sfx('ok');
    }

    function unequipItem(id) {
      var g = findItem(id);
      if (!g) return;
      clearEqId(id);
      syncLegacyEq();
      clampHp();
      save();
      renderAll();
    }

    function sellItem(id) {
      var g = findItem(id);
      if (!g) return;
      var price = sellPrice(g);
      clearEqId(id);
      S.inv = S.inv.filter(function (x) { return x.id !== id; });
      S.coins += price;
      clampHp();
      save();
      renderAll();
      toast('出售 ' + g.name + '，+' + price + ' 金幣');
      sfx('coin');
    }

    function enhanceItem(idOrItem, kind, roll) {
      var g = (idOrItem && typeof idOrItem === 'object') ? idOrItem : findItem(idOrItem);
      if (!g) return { ok: false, reason: 'noitem', plus: 0, life: 0 };
      migrateItem(g);
      if (kind === 'life') {
        if ((g.life || 0) >= 4) return { ok: false, reason: 'life-max', plus: g.plus, life: g.life };
        if (gemCount('life') < 1) return { ok: false, reason: 'no-gem', plus: g.plus, life: g.life };
        S.gems.life -= 1;
        g.life = (g.life || 0) + 1;
        return { ok: true, reason: 'ok', plus: g.plus, life: g.life, consumed: true };
      }
      if (kind === 'bless') {
        if ((g.plus || 0) >= 9) return { ok: false, reason: 'need-soul', plus: g.plus, life: g.life };
        if (gemCount('bless') < 1) return { ok: false, reason: 'no-gem', plus: g.plus, life: g.life };
        S.gems.bless -= 1;
        var nextB = (g.plus || 0) + 1;
        var rateB = nextPlusRate(nextB);
        var okB = (roll != null ? roll : Math.random()) < rateB;
        if (okB) g.plus = nextB;
        return { ok: okB, reason: okB ? 'ok' : 'fail', plus: g.plus, life: g.life, rate: rateB, consumed: true };
      }
      if (kind === 'soul') {
        if ((g.plus || 0) < 9) return { ok: false, reason: 'need-bless', plus: g.plus, life: g.life };
        if ((g.plus || 0) >= 12) return { ok: false, reason: 'max', plus: g.plus, life: g.life };
        if (gemCount('soul') < 1) return { ok: false, reason: 'no-gem', plus: g.plus, life: g.life };
        S.gems.soul -= 1;
        var nextS = g.plus + 1;
        var rateS = nextPlusRate(nextS);
        var okS = (roll != null ? roll : Math.random()) < rateS;
        if (okS) g.plus = nextS;
        return { ok: okS, reason: okS ? 'ok' : 'fail', plus: g.plus, life: g.life, rate: rateS, consumed: true };
      }
      return { ok: false, reason: 'bad-kind', plus: g.plus, life: g.life };
    }

    function renderEnhance() {
      if (!slotInfo(enhSlot)) enhSlot = 'weapon';
      var g = getEq(enhSlot);
      var html = '<h2>裝備強化</h2>';
      html += '<p class="hint">強化會消耗寶石，且強化等級屬於該件裝備。祝福寶石用於 +1～+9，靈魂寶石用於 +10～+12，生命寶石可為主屬性額外 +1～+4（顯示為生命+N）。失敗只消耗寶石，不會掉級。金幣仍可用於商店。</p>';
      html += gemBarHtml();
      html += '<h2>選擇部位</h2><div class="slot-grid">';
      for (var s = 0; s < SLOT_DEFS.length; s++) {
        var id = SLOT_DEFS[s].id;
        html += slotCellHtml(id, { pick: true, selected: enhSlot === id });
      }
      html += '</div>';
      if (!g) {
        html += '<div class="enh-card"><div class="empty">此部位尚未裝備。請先到背包裝備物品，強化等級會跟著裝備走。</div></div>';
      } else {
        html += enhanceCard(g);
      }
      el['enhance-body'].innerHTML = html;
      el['enhance-body'].querySelectorAll('[data-enh-slot]').forEach(function (b) {
        b.onclick = function () { enhSlot = b.getAttribute('data-enh-slot'); renderEnhance(); };
      });
      var bb = document.getElementById('enh-bless');
      var bs = document.getElementById('enh-soul');
      var bl = document.getElementById('enh-life');
      if (bb) bb.onclick = function () { doEnhance('bless'); };
      if (bs) bs.onclick = function () { doEnhance('soul'); };
      if (bl) bl.onclick = function () { doEnhance('life'); };
    }

    function enhanceCard(g) {
      var info = slotInfo(itemSlot(g)) || SLOT_DEFS[0];
      var R = RARITY[g.rarity];
      var plus = g.plus || 0;
      var life = g.life || 0;
      var html = '<div class="enh-card" id="card-enh">';
      html += '<div class="row"><div><div style="font-size:13px;color:var(--muted)">' + info.ico + ' ' + info.name + '</div>';
      html += '<div class="iname" style="color:' + R.color + '">' + esc(g.name) + '</div>';
      html += '<div class="enh-plus">+' + plus + (life ? '　<span class="life-tag">生命+' + life + '</span>' : '') + '</div></div>';
      html += '<div style="text-align:right;font-size:12px;color:var(--muted)">' + itemStatText(g, false) + '</div></div>';
      if (plus < 9) {
        var nb = plus + 1;
        var rb = nextPlusRate(nb);
        var haveB = gemCount('bless');
        html += '<div class="enh-need">下一級 <b>+' + nb + '</b>　消耗 <b>祝福寶石 ×1</b>（持有 ' + haveB + '）<br>成功率 <b class="' + (rb < 1 ? (rb < 0.5 ? 'danger' : 'risky') : '') + '">' + Math.round(rb * 100) + '%</b></div>';
        html += '<button class="enh-btn" id="enh-bless"' + (haveB < 1 ? ' disabled' : '') + '>祝福強化 → +' + nb + '</button>';
      } else if (plus < 12) {
        html += '<div class="enh-need">已達祝福上限 +9，改用靈魂寶石繼續強化。</div>';
      } else {
        html += '<div class="enh-need">強化等級已達上限 +12。</div>';
      }
      if (plus >= 9 && plus < 12) {
        var ns = plus + 1;
        var rs = nextPlusRate(ns);
        var haveS = gemCount('soul');
        html += '<div class="enh-need">下一級 <b>+' + ns + '</b>　消耗 <b>靈魂寶石 ×1</b>（持有 ' + haveS + '）<br>成功率 <b class="danger">' + Math.round(rs * 100) + '%</b></div>';
        html += '<button class="enh-btn" id="enh-soul"' + (haveS < 1 ? ' disabled' : '') + '>靈魂強化 → +' + ns + '</button>';
      }
      if (life < 4) {
        var haveL = gemCount('life');
        html += '<div class="enh-need">生命寶石為主屬性 +1（下一次顯示 <b>生命+' + (life + 1) + '</b>）　持有 ' + haveL + '　成功率 <b>100%</b>　最多 4 次</div>';
        html += '<button class="enh-btn" id="enh-life"' + (haveL < 1 ? ' disabled' : '') + '>賦予生命 → 生命+' + (life + 1) + '</button>';
      } else {
        html += '<div class="enh-need">生命寶石已達上限（生命+4）。</div>';
      }
      html += '</div>';
      return html;
    }

    function doEnhance(kind) {
      var g = getEq(enhSlot);
      if (!g) { toast('請先裝備此部位'); return; }
      var beforePlus = g.plus || 0;
      var beforeLife = g.life || 0;
      var res = enhanceItem(g, kind);
      var card = document.getElementById('card-enh');
      if (res.reason === 'no-gem') { toast('寶石不足'); return; }
      if (res.reason === 'need-soul') { toast('+9 之後請改用靈魂寶石'); return; }
      if (res.reason === 'need-bless') { toast('靈魂寶石只能用於 +10～+12'); return; }
      if (res.reason === 'life-max') { toast('生命寶石最多使用 4 次'); return; }
      if (res.reason === 'max') { toast('已達強化上限 +12'); return; }
      if (!res.consumed && !res.ok) { toast('無法強化'); return; }
      if (res.ok) {
        if (kind === 'life') {
          sfx('ok');
          toast(g.name + ' 生命+' + res.life);
          log('對「' + g.name + '」使用生命寶石，現在是生命+' + res.life + '。', 'ok');
        } else {
          if (kind === 'life') {}
          if (S.hp > 0) { var m = playerMaxHp(); S.hp = Math.min(m, S.hp + 4); }
          sfx('ok');
          toast(g.name + ' 強化成功！+' + res.plus);
          log('「' + g.name + '」強化成功，現在是 +' + res.plus + '。', 'ok');
        }
        if (card) { card.classList.remove('flash-fail'); card.classList.add('flash-ok'); }
      } else {
        sfx('fail');
        toast('強化失敗…寶石已消耗，等級不變（仍為 +' + beforePlus + '）');
        log('「' + g.name + '」強化失敗，仍是 +' + beforePlus + '。', 'bad');
        if (card) { card.classList.remove('flash-ok'); card.classList.add('flash-fail'); }
      }
      clampHp();
      save();
      renderAll();
    }

    function renderShop() {
      var autoMax = S.autoLv >= 5;
      var autoCost = autoUpgradeCost();
      var autoTitle = S.autoLv === 0 ? '解鎖自動攻擊' : ('升級自動攻擊 至 Lv.' + (S.autoLv + 1));
      var autoDesc = S.autoLv === 0
        ? '解鎖後會自動揮劍攻擊魔物；離開遊戲或切換分頁時，也會依攻擊效率繼續掛機練功。'
        : '縮短自動攻擊間隔（目前 ' + (autoInterval() / 1000).toFixed(2) + ' 秒），離線掛機也會跟著加快。最高 5 級。';
      var html = '<h2>旅人商店</h2><p class="hint">用打怪賺來的金幣補給、解鎖自動攻擊，或永久提升生命上限。離開時會自動存檔並結算掛機收益。</p>';
      html += shopCard('回復藥水', '🧪', '立即恢復 35% 最大生命。', potSmallCost(), '購買', 'pot-s', S.hp >= playerMaxHp());
      html += shopCard('高級藥水', '🧴', '立即恢復 70% 最大生命。', potBigCost(), '購買', 'pot-b', S.hp >= playerMaxHp());
      html += shopCard('生命修煉', '❤️', '永久增加 20 點生命上限，並立即回復等量生命。已修煉 ' + S.hpBoost + ' 次。', hpBoostCost(), '修煉', 'hp-up', false);
      html += shopCard(autoTitle, '⚔️', autoDesc, autoCost, autoMax ? '已滿級' : (S.autoLv === 0 ? '解鎖' : '升級'), 'auto', autoMax);
      el['shop-body'].innerHTML = html;
      bindShop();
    }

    function shopCard(title, ico, desc, price, btn, key, dis) {
      var can = !dis && S.coins >= price;
      return '<div class="shop-card"><div class="row"><div style="font-weight:700">' + ico + ' ' + title + '</div>' +
        '<div class="price">' + (dis && key === 'auto' ? '—' : ('🪙 ' + price)) + '</div></div>' +
        '<p>' + desc + '</p>' +
        '<button class="shop-btn ok" data-shop="' + key + '"' + (can ? '' : ' disabled') + '>' + btn + '</button></div>';
    }

    function bindShop() {
      el['shop-body'].querySelectorAll('[data-shop]').forEach(function (b) {
        b.onclick = function () { buy(b.getAttribute('data-shop')); };
      });
    }

    function buy(key) {
      if (key === 'pot-s' || key === 'pot-b') {
        var cost = key === 'pot-s' ? potSmallCost() : potBigCost();
        if (S.coins < cost) { toast('金幣不足'); return; }
        if (S.hp >= playerMaxHp()) { toast('生命已滿'); return; }
        S.coins -= cost;
        var pct = key === 'pot-b' ? 0.7 : 0.35;
        var heal = Math.max(1, Math.round(playerMaxHp() * pct));
        S.hp = Math.min(playerMaxHp(), S.hp + heal);
        floatText('+' + heal, '#6ee09a', false, 0.5);
        sfx('ok');
        toast('回復 ' + heal + ' 點生命');
        log('喝下藥水，回復 ' + heal + ' 點生命。', 'ok');
      } else if (key === 'hp-up') {
        var c2 = hpBoostCost();
        if (S.coins < c2) { toast('金幣不足'); return; }
        S.coins -= c2;
        S.hpBoost += 1;
        S.hp = Math.min(playerMaxHp(), S.hp + 20);
        sfx('lv');
        toast('生命上限 +20');
        log('生命修煉成功，上限提升。', 'ok');
      } else if (key === 'auto') {
        if (S.autoLv >= 5) return;
        var c3 = autoUpgradeCost();
        if (S.coins < c3) { toast('金幣不足'); return; }
        S.coins -= c3;
        S.autoLv += 1;
        autoTimer = 0;
        sfx('ok');
        toast(S.autoLv === 1 ? '已解鎖自動攻擊' : ('自動攻擊升級至 Lv.' + S.autoLv));
        log(S.autoLv === 1 ? '解鎖了自動攻擊！' : ('自動攻擊提升至 Lv.' + S.autoLv + '。'), 'ok');
      }
      save();
      renderAll();
    }

    function renderAll() {
      renderHero();
      renderMonsterBar();
      if (tab === 'bag') renderBag();
      if (tab === 'enhance') renderEnhance();
      if (tab === 'shop') renderShop();
    }

    function switchTab(name) {
      tab = name;
      document.querySelectorAll('.panel').forEach(function (p) {
        p.classList.toggle('active', p.id === 'panel-' + name);
      });
      document.querySelectorAll('nav button').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-tab') === name);
      });
      renderAll();
    }

    function showIntro() {
      el.intro.innerHTML = '<div class="modal-card"><h3>深淵奪寶</h3>' +
        '<p>點擊魔物或「攻擊」來戰鬥。魔物會定時反擊，注意生命值。</p>' +
        '<p class="sub">擊敗魔物可獲得金幣與經驗，並掉落武器、頭盔、鎧甲、項鍊、手套、護腿、鞋子、內衣，以及祝福、靈魂、生命寶石。<br>' +
        '每層第 ' + WAVES_PER_STAGE + ' 隻是首領。可切換「自動練功／手動練功」；手動點擊傷害更高、掉寶較佳。<br>' +
        '強化改為消耗寶石，等級跟著裝備走。離開會自動存檔並結算掛機。若你是重新下載遊戲檔，請用右上角 💾 匯出存檔，換檔後再匯入，否則進度會讀不到。</p>' +
        '<div class="modal-actions"><button type="button" id="intro-ok">開始冒險</button></div></div>';
      el.intro.classList.add('show');
      document.getElementById('intro-ok').onclick = function () {
        el.intro.classList.remove('show');
        S.seenIntro = true;
        ensureAudio();
        save();
        maybeAskName();
      };
    }

    function confirmReset() {
      el.modal.innerHTML = '<div class="modal-card"><h3>重置進度</h3>' +
        '<p>確定要刪除所有存檔，從頭開始嗎？此操作無法復原。</p>' +
        '<div class="modal-actions">' +
        '<button type="button" class="ghost" id="rst-no">取消</button>' +
        '<button type="button" id="rst-yes">確定重置</button></div></div>';
      el.modal.classList.add('show');
      document.getElementById('rst-no').onclick = function () { el.modal.classList.remove('show'); };
      document.getElementById('rst-yes').onclick = function () {
        el.modal.classList.remove('show');
        clearAllStorage().then(function () {
          resetGame();
          toast('已重置進度');
        });
      };
    }

    var canvas, ctx, lastTs = 0, cssW = 0, cssH = 0;

    function resizeCanvas() {
      canvas = el.fx;
      if (!canvas) return;
      var rec = canvas.getBoundingClientRect();
      cssW = rec.width; cssH = rec.height;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.floor(rec.width * dpr));
      canvas.height = Math.max(1, Math.floor(rec.height * dpr));
      ctx = canvas.getContext('2d');
      if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function tick(ts) {
      requestAnimationFrame(tick);
      if (!lastTs) lastTs = ts;
      var dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;

      if (document.hidden) {
        hiddenCombat = true;
        lastTs = 0;
        return;
      }

      if (!combatLock && monster && monster.hp > 0 && S.hp > 0) {
        monTimer += dt * 1000;
        if (monTimer >= monAtkInterval()) {
          monTimer = 0;
          doMonsterAttack();
        }
        if (S.autoLv > 0 && S.trainMode === 'auto') {
          autoTimer += dt * 1000;
          var iv = autoInterval();
          var swings = 0;
          while (iv > 0 && autoTimer >= iv && swings < 8 && monster && monster.hp > 0 && !combatLock) {
            autoTimer -= iv;
            swings += 1;
            doPlayerAttack(true);
          }
          if (autoTimer > iv * 2) autoTimer = iv;
        }
      }

      if (ctx && cssW) {
        ctx.clearRect(0, 0, cssW, cssH);
        for (var i = particles.length - 1; i >= 0; i--) {
          var p = particles[i];
          p.life -= dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 180 * dt;
          if (p.life <= 0) { particles.splice(i, 1); continue; }
          ctx.globalAlpha = Math.max(0, p.life / 0.5);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }

    function bind() {
      el['btn-attack'].addEventListener('click', function (e) {
        e.stopPropagation();
        ensureAudio();
        doPlayerAttack(false);
      });
      var lastTouchAtk = 0;
      el.arena.addEventListener('click', function () {
        if (performance.now() - lastTouchAtk < 500) return;
        ensureAudio();
        doPlayerAttack(false);
      });
      el.arena.addEventListener('touchstart', function (e) {
        if (e.cancelable) e.preventDefault();
        lastTouchAtk = performance.now();
        ensureAudio();
        doPlayerAttack(false);
      }, { passive: false });
      document.querySelectorAll('nav button').forEach(function (b) {
        b.addEventListener('click', function () { switchTab(b.getAttribute('data-tab')); });
      });
      el['btn-mute'].addEventListener('click', function () {
        S.mute = !S.mute;
        if (!S.mute) unlockAudio();
        save();
        renderHero();
      });
      el['btn-reset'].addEventListener('click', confirmReset);
      var hint = document.getElementById('bookmark-hint');
      var hintBtn = document.getElementById('btn-hint-ok');
      if (hint && location.protocol === 'https:') {
        var dismissed = false;
        try { dismissed = localStorage.getItem('sydb-bookmark-hint') === '1'; } catch (e) {}
        if (!dismissed) hint.classList.add('show');
      }
      if (hintBtn) hintBtn.addEventListener('click', function () {
        if (hint) hint.classList.remove('show');
        try { localStorage.setItem('sydb-bookmark-hint', '1'); } catch (e) {}
      });
      if (el['btn-save']) el['btn-save'].addEventListener('click', showSaveModal);
      if (el['btn-lb']) el['btn-lb'].addEventListener('click', showLeaderboard);
      if (el['mode-toggle']) {
        el['mode-toggle'].querySelectorAll('button').forEach(function (b) {
          b.addEventListener('click', function () { setTrainMode(b.getAttribute('data-mode')); });
        });
      }
      if (el['file-import']) {
        el['file-import'].addEventListener('change', function () {
          var f = el['file-import'].files && el['file-import'].files[0];
          el['file-import'].value = '';
          if (!f) return;
          var reader = new FileReader();
          reader.onload = function () {
            if (importFromText(String(reader.result || ''))) {
              if (!document.getElementById('offline-card')) {
                el.modal.classList.remove('show');
                toast('存檔已匯入');
              }
            } else toast('存檔檔無效');
          };
          reader.readAsText(f);
        });
      }
      function onAudioGesture() { unlockAudio(); }
      document.addEventListener('pointerdown', onAudioGesture, { capture: true, passive: true });
      document.addEventListener('touchstart', onAudioGesture, { capture: true, passive: true });
      document.addEventListener('keydown', onAudioGesture, { capture: true });
      window.addEventListener('pageshow', function () { unlockAudio(); });
      window.addEventListener('beforeunload', stampAndSave);
      window.addEventListener('pagehide', stampAndSave);
      window.addEventListener('resize', resizeCanvas);
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          hiddenCombat = true;
          stampAndSave();
          lastTs = 0;
        } else {
          unlockAudio();
          var report = applyOfflineProgress();
          hiddenCombat = false;
          lastTs = 0;
          monTimer = 0;
          autoTimer = 0;
          if (report && report.showPopup && S.seenIntro) showOfflinePopup(report);
          renderAll();
        }
      });
      if (saveTimer) clearInterval(saveTimer);
      saveTimer = setInterval(function () {
        if (!document.hidden) stampAndSave();
      }, 15000);
    }

    var readyResolve;
    var gameReady = new Promise(function (resolve) { readyResolve = resolve; });

    function markStorageReadable() {
      var backends = [];
      try { if (readLocalStorage()) backends.push('本機'); } catch (e) {}
      try { if (readCookie()) backends.push('Cookie'); } catch (e) {}
      if (backends.length) {
        storageInfo.ok = true;
        storageInfo.backends = backends;
        storageInfo.lastOk = Date.now();
      }
    }

    function finishInit(loaded) {
      bind();
      resizeCanvas();
      var offlineReport = null;
      if (loaded) {
        markStorageReadable();
        offlineReport = applyOfflineProgress();
      }
      if (!monster) spawnMonster();
      else syncMonsterSprite();
      ensurePlayerId();
      bumpBestFloor();
      renderAll();
      save();
      updateSaveStatus();
      startLbTimer();
      requestAnimationFrame(tick);
      pendingOfflineReport = (offlineReport && offlineReport.showPopup) ? offlineReport : null;
      if (!S.seenIntro) showIntro();
      else if (!isValidName(S.playerName)) maybeAskName();
      else if (pendingOfflineReport) {
        showOfflinePopup(pendingOfflineReport);
        pendingOfflineReport = null;
      } else if (loaded) log('歡迎回來，冒險者。進度已載入。', 'ok');
      if (!loaded) log('踏上深淵之路。點擊魔物或攻擊按鈕開始戰鬥！', '');
      if (isValidName(S.playerName)) submitLeaderboard({ force: true });
      if (readyResolve) readyResolve(true);
    }

    function init() {
      cacheEls();
      loadAll().then(function (loaded) {
        finishInit(!!loaded);
      }).catch(function () {
        finishInit(load());
      });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();

    window.__GAME__ = {
      ready: gameReady,
      getState: function () { return S; },
      getMonster: function () { return monster; },
      attack: function () { doPlayerAttack(false); },
      doPlayerAttack: doPlayerAttack,
      spawn: spawnMonster,
      save: stampAndSave,
      reset: resetGame,
      SAVE_KEY: SAVE_KEY,
      autoInterval: autoInterval,
      formatDuration: formatDuration,
      getLastSeen: function () { return lastSeen; },
      applyOfflineFor: function (ms) {
        lastSeen = Date.now() - ms;
        return applyOfflineProgress();
      },
      exportCode: exportCode,
      importFromText: importFromText,
      payloadRaw: payloadRaw,
      itemPower: itemPower,
      placeItem: placeItem,
      storageInfo: function () { return storageInfo; },
      setTrainMode: setTrainMode,
      INV_MAX: INV_MAX,
      unlockAudio: unlockAudio,
      getAudioContext: function () { return audioCtx; },
      applyPayload: applyPayload,
      migrateState: migrateState,
      makeGear: makeGear,
      enhanceItem: enhanceItem,
      inheritEnhance: inheritEnhance,
      inheritCost: inheritCost,
      itemPowerAfterInherit: itemPowerAfterInherit,
      autoEquipBest: autoEquipBest,
      addGem: addGem,
      rollGemDrops: rollGemDrops,
      nextPlusRate: nextPlusRate,
      effectiveAtk: effectiveAtk,
      effectiveDef: effectiveDef,
      effectiveHp: effectiveHp,
      effectiveHit: effectiveHit,
      effectiveDodge: effectiveDodge,
      effectiveCrit: effectiveCrit,
      effectiveCritDmg: effectiveCritDmg,
      playerHit: playerHit,
      playerDodge: playerDodge,
      playerCritRate: playerCritRate,
      playerCritDmg: playerCritDmg,
      hitChance: hitChance,
      setCombatRolls: setCombatRolls,
      doMonsterAttack: doMonsterAttack,
      itemSlot: itemSlot,
      getEq: getEq,
      equipItem: equipItem,
      sfx: sfx,
      sfxLog: function () { return sfxLog.slice(); },
      clearSfxLog: function () { sfxLog = []; },
      SLOTS: SLOT_DEFS,
      GEMS: GEMS,
      sanitizeName: sanitizeName,
      ensurePlayerId: ensurePlayerId,
      playerPower: playerPower,
      submitLeaderboard: function (opts) { return submitLeaderboard(opts || { force: true }); },
      fetchLeaderboard: fetchLeaderboard,
      showNameModal: showNameModal,
      showLeaderboard: showLeaderboard,
      LB_URL: LB_URL
    };
  })();
  </script>
